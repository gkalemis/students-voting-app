services:
  voting-app:
    build: .
    container_name: ntua-voting-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - SECRET_KEY=ntua-voting-secret-key-production-replace-me
    volumes:
      - ./data:/app/data
