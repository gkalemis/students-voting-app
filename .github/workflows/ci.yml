name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: |
          export SECRET_KEY="$(openssl rand -hex 32)"
          export ADMIN_USERNAME=ci-admin
          export ADMIN_PASSWORD=ci-bootstrap-password
          export PUBLIC_BASE_URL=https://example.invalid
          export ALLOWED_HOSTS=example.invalid,127.0.0.1
          export TRAEFIK_ENABLED=true
          export TRAEFIK_HOST=example.invalid
          export TRAEFIK_NETWORK=proxy
          export TRAEFIK_ROUTER_NAME=voting-ci
          export TRAEFIK_ENTRYPOINT=websecure
          export TRAEFIK_CERTRESOLVER=letsencrypt
          docker compose config --quiet
