name: Bug report
description: Report a reproducible problem without private or production data
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real student information, production exports, or vulnerability details. Use private vulnerability reporting for security issues.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, deployment method, and relevant non-secret configuration.

